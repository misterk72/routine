version: "3.8"

services:
  grafana:
    env_file:
      - ../docker-sqlite/.env
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - default
      - healthtracker
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning
      - ./dashboards:/var/lib/grafana/dashboards
networks:
  healthtracker:
    external: true
    name: docker-sqlite_default

volumes:
  grafana-data:
